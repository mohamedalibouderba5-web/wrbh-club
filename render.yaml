services:
  - type: web
    name: wrbh-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_TEST_CLEANUP
        value: "false"
      - key: MIN_ATHLETE_AGE
        value: "5"
      - key: MAX_ATHLETE_AGE
        value: "17"
      - key: PYTHONPATH
        value: /opt/render/project/src

  - type: web
    name: wrbh-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
