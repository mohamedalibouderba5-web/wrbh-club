server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy (évite dépendance fragile à api.nadi-connect.com côté navigateur)
  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 25m;
  }

  location /media/ {
    proxy_pass http://api:8000/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 25m;
  }

  # Never SPA-fallback APK / binary downloads (avoids fake "1.12.0.apk" = HTML)
  location ~* \.(apk|aab|ipa)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # Hashed Vite assets — long cache OK
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA shell — never cache HTML (évite Cloudflare / navigateurs bloqués sur ancienne UI)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri /index.html;
  }
}
