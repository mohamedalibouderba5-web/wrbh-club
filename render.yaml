services:
  - type: web
    name: wrbh-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://wrbh-web.onrender.com,http://localhost:5173,http://127.0.0.1:5173"
      - key: ENVIRONMENT
        value: production
      - key: ALLOW_TEST_CLEANUP
        value: "false"
      - key: MIN_ATHLETE_AGE
        value: "5"
      - key: MAX_ATHLETE_AGE
        value: "17"
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: ANDROID_APP_VERSION
        value: "1.4.0"
      - key: ANDROID_VERSION_CODE
        value: "5"
      - key: ANDROID_APK_URL
        value: https://github.com/mohamedalibouderba5-web/wrbh-club/releases/download/android-v1.4.0/wrbh-club-1.4.0.apk
      - key: ANDROID_FORCE_UPDATE
        value: "false"
      - key: ANDROID_RELEASE_NOTES
        value: "Onglet Plus, athlètes, inscriptions, équipes, matériel, historique, finance, mises à jour auto."
      - key: ANDROID_RELEASE_NOTES_AR
        value: "تبويب المزيد والوحدات الكاملة وتحديث تلقائي للتطبيق."

  - type: web
    name: wrbh-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://wrbh-api.onrender.com
      - key: VITE_ANDROID_APK_URL
        value: https://github.com/mohamedalibouderba5-web/wrbh-club/releases/download/android-v1.4.0/wrbh-club-1.4.0.apk
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
